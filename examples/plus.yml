# pp — declarative tmux farm for pi agents
# Docs: https://github.com/HardyDou/pi-plus
version: 1

# Optional: run every session on a dedicated tmux socket.
# tmux:
#   socket: pi-plus

defaults:
  agent: pi
  args: []
  env: {}

sessions:
  - name: backend
    cwd: ~/code/backend
    restart: always                 # no | always | on-failure | unless-stopped

  - name: docs
    cwd: ~/code/docs
    # pi_session: 1a2b3c4d          # resume this pi session id (or .jsonl path)
    # pi_session_name: docs         # default: session name
    # remote_pi_name: docs          # default: session name
    # remote_pi_mode: config        # config | env | off

  - name: ops
    cwd: ~/code/ops
    agent: bash                     # non-pi agent: no pi flags added

  #  - name: spare
  #    cwd: ~/code/spare
  #    restart: no                  # never auto-started; bring it up with: pp up spare
